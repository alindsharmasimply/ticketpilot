[project]
name = "ticketpilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alindsharmasimply", email = "alindsharmasimply@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2,<3",
]

[project.scripts]
ticketpilot = "ticketpilot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
